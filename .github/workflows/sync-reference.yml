name: Reference sync

on:
  schedule: [{cron: '0 */6 * * *'}]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: reference-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Refresh reference-src and open the pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run sync:reference
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run gen:reference
      - name: Open or update the pull request
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && test -z "$(git status --porcelain --untracked-files=all reference-src docs/reference)"; then
            echo "the reference is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/reference-sync
          git add -A reference-src docs/reference
          git commit -m "chore(reference): sync from stardelt/stardelt main"
          git push --force-with-lease origin chore/reference-sync
          echo "pushed=1" >> "$GITHUB_OUTPUT"
          if ! gh pr list --head chore/reference-sync --state open --json number -q '.[0].number' | grep -q .; then
            gh pr create --base main --head chore/reference-sync \
              --title "chore(reference): sync from stardelt/stardelt main" \
              --body "Generated by \`.github/workflows/sync-reference.yml\`: \`npm run sync:reference\` and \`npm run gen:reference\` against \`stardelt/stardelt\` \`main\`. The usual CI and merge rules apply; never merge it while \`docs/reference\` is stale."
          fi
      - name: Run the required CI on the sync branch
        if: steps.sync.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref chore/reference-sync

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Docs build (broken links fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/check-images.mjs
      - run: npm run check:sidebars
      - run: npm run check:page-budget
      - run: npm run check:release-words
      - run: npm run gen:reference
      - run: git diff --exit-code docs/reference
      - run: test -z "$(git status --porcelain --untracked-files=all docs/reference)"
      - run: npm run build
  commands:
    name: Every stardelt command in the docs exists on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: stardelt/stardelt
          path: .product
          sparse-checkout: python
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ./.product/python
      - run: python .product/python/scripts/check_doc_commands.py docs

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Docs build (broken links fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run gen:reference
      - run: git diff --exit-code docs/reference
      - run: test -z "$(git status --porcelain --untracked-files=all docs/reference)"
      - run: npm run build

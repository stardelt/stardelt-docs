<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 184" width="772" role="img" aria-label="Planned secrets flow: you, secret store, synced secret, your job">
<title>Planned secrets flow: you, secret store, synced secret, your job</title>
<rect x="0.5" y="0.5" width="771" height="183" rx="12" fill="#ffffff" stroke="#d0d7e2"/>
<text x="16" y="24" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1b2a4e">Secrets: planned flow (references, never values)</text><rect x="16" y="44" width="150" height="70" rx="8" fill="#eaf0ff" stroke="#5b7bd5"/><text x="91.0" y="75.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1b2a4e">You</text><text x="91.0" y="93.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1b2a4e">Connections page</text><text x="91.0" y="107.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1b2a4e">or YAML in Git</text><line x1="168" y1="79" x2="198" y2="79" stroke="#6b778c" stroke-width="2"/><polygon points="204,79 196,74 196,84" fill="#6b778c"/><rect x="206" y="44" width="170" height="70" rx="8" fill="#f6e7d8" stroke="#b0764a"/><text x="291.0" y="75.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#4a2e14">Secret store</text><text x="291.0" y="93.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#4a2e14">sandbox: OpenBao</text><text x="291.0" y="107.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#4a2e14">company: key vault, Vault</text><line x1="378" y1="79" x2="408" y2="79" stroke="#6b778c" stroke-width="2"/><polygon points="414,79 406,74 406,84" fill="#6b778c"/><rect x="416" y="44" width="150" height="70" rx="8" fill="#e8eaee" stroke="#7d8794"/><text x="491.0" y="75.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2a3038">Synced Secret</text><text x="491.0" y="93.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#2a3038">conn-&lt;name&gt;</text><text x="491.0" y="107.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#2a3038">(External Secrets)</text><line x1="568" y1="79" x2="598" y2="79" stroke="#6b778c" stroke-width="2"/><polygon points="604,79 596,74 596,84" fill="#6b778c"/><rect x="606" y="44" width="150" height="70" rx="8" fill="#dff3e6" stroke="#4a9d6b"/><text x="681.0" y="75.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#123d25">Your job</text><text x="681.0" y="93.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#123d25">pipeline env or</text><text x="681.0" y="107.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#123d25">stardelt.connection()</text><text x="16" y="146" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#4a5568">The definition (host, port, type, owner group) lives in Git. The password does not.</text><text x="16" y="166" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#4a5568">Your company store is the single source: connect it once, as you connect your identity provider.</text>
</svg>

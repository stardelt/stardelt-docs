<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" role="img" aria-label="Choosing Trino or Spark">
<title>Choosing Trino or Spark</title>
<rect x="0.5" y="0.5" width="679" height="249" rx="12" fill="#ffffff" stroke="#d0d7e2"/>
<text x="16" y="24" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1b2a4e">Trino or Spark?</text><rect x="16" y="40" width="300" height="40" rx="8" fill="#eef1f6" stroke="#9aa6b8"/><text x="166.0" y="65.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#222c3b">Your question</text><line x1="166" y1="82" x2="166" y2="96" stroke="#6b778c" stroke-width="2"/><rect x="16" y="98" width="300" height="44" rx="8" fill="#eef1f6" stroke="#9aa6b8"/><text x="166.0" y="125.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#222c3b">Is it SQL on tables, up to some GB?</text><line x1="318" y1="120" x2="354" y2="120" stroke="#6b778c" stroke-width="2"/><polygon points="360,120 352,115 352,125" fill="#6b778c"/><rect x="362" y="84" width="300" height="76" rx="8" fill="#dff3e6" stroke="#4a9d6b"/><text x="512.0" y="117.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#123d25">Trino</text><text x="512.0" y="135.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#123d25">interactive, BI, SQL models, small to medium</text><text x="512.0" y="149.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#123d25">runs as you; permissions apply</text><line x1="166" y1="144" x2="166" y2="170" stroke="#6b778c" stroke-width="2"/><text x="176" y="162" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#4a5568">no: heavy Python, big joins, JDBC pulls, ML prep</text><rect x="16" y="172" width="300" height="62" rx="8" fill="#e6e1f7" stroke="#7a62c9"/><text x="166.0" y="199.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2a1f5c">Spark</text><text x="166.0" y="217.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#2a1f5c">large batch, non-SQL code, big file ingestion</text><text x="166.0" y="231.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#2a1f5c">uses the platform storage credential</text><text x="362" y="190" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#4a5568">Both read and write the same Iceberg tables.</text><text x="362" y="208" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#4a5568">Start with Trino; move a step to Spark when</text><text x="362" y="224" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#4a5568">it no longer fits SQL or one machine.</text>
</svg>

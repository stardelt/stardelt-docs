<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 298" width="672" role="img" aria-label="Medallion layers as schemas: bronze, silver, gold">
<title>Medallion layers as schemas: bronze, silver, gold</title>
<rect x="0.5" y="0.5" width="671" height="297" rx="12" fill="#ffffff" stroke="#d0d7e2"/>
<text x="16" y="24" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1b2a4e">Layers are schemas</text><rect x="16" y="40" width="640" height="62" rx="8" fill="#f6e7d8" stroke="#b0764a"/><text x="30" y="64" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#4a2e14">bronze_&lt;source&gt;</text><text x="30" y="86" font-size="12" fill="#4a2e14" font-family="ui-monospace, Menlo, monospace">bronze_crm.accounts</text><text x="330" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#4a2e14">raw copy of the source, append-only</text><text x="330" y="86" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#4a2e14">+ _ingested_at, _source, _batch_id</text><rect x="16" y="112" width="640" height="62" rx="8" fill="#e8eaee" stroke="#7d8794"/><text x="30" y="136" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#2a3038">silver_&lt;domain&gt;</text><text x="30" y="158" font-size="12" fill="#2a3038" font-family="ui-monospace, Menlo, monospace">silver_sales.customers</text><text x="330" y="138" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#2a3038">cleaned, typed, deduplicated (MERGE)</text><text x="330" y="158" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#2a3038">one row per business key</text><rect x="16" y="184" width="640" height="62" rx="8" fill="#fbf0c9" stroke="#c9a227"/><text x="30" y="208" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#4a3b05">gold_&lt;product&gt;</text><text x="30" y="230" font-size="12" fill="#4a3b05" font-family="ui-monospace, Menlo, monospace">gold_finance.revenue_by_month</text><text x="330" y="210" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#4a3b05">business-ready, stable contract</text><text x="330" y="230" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#4a3b05">what dashboards and analysts read</text><text x="16" y="264" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#4a5568">Write: ingestion jobs to bronze, engineers to silver, pipelines to gold.</text><text x="16" y="282" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#4a5568">Read: analysts use gold. Table property: stardelt.layer.</text>
</svg>

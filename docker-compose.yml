services:
  docs:
    image: node:20
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
volumes:
  node_modules:
